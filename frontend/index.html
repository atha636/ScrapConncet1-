<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO tags -->
    <title>ScrapConnect — Sell Your Scrap, Get Picked Up Fast</title>
    <meta
      name="description"
      content="ScrapConnect connects people with scrap metal, plastic, paper, and e-waste to nearby collectors. Request a pickup in minutes, track it live, and get paid — no listing fees, no hassle."
    />
    <meta name="keywords" content="scrap pickup, scrap collector, sell scrap metal, e-waste recycling, scrap dealer near me, scrap marketplace" />
    <meta name="author" content="ScrapConnect" />
    <link rel="canonical" href="https://scrap-conncet1.vercel.app/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ScrapConnect" />
    <meta property="og:title" content="ScrapConnect — Sell Your Scrap, Get Picked Up Fast" />
    <meta
      property="og:description"
      content="Request a scrap pickup in minutes and get matched with a collector nearby. Track your pickup live and get paid on the spot."
    />
    <meta property="og:image" content="https://scrap-conncet1.vercel.app/og-image.png" />
    <meta property="og:url" content="https://scrap-conncet1.vercel.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ScrapConnect — Sell Your Scrap, Get Picked Up Fast" />
    <meta
      name="twitter:description"
      content="Request a scrap pickup in minutes and get matched with a collector nearby. Track your pickup live and get paid on the spot."
    />
    <meta name="twitter:image" content="https://scrap-conncet1.vercel.app/og-image.png" />

    <!-- Default crawl directive — overridden per-page by useDocumentMeta for
         authenticated views, which set noindex since they're private data. -->
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#A63D24" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ScrapConnect" />

    <!-- Structured data: helps search engines show a rich result for the
         product itself rather than treating it as an unlabeled page. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "ScrapConnect",
        "applicationCategory": "MarketplaceApplication",
        "description": "A marketplace connecting people with scrap material to nearby collectors for pickup.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
