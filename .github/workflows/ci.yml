name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, test & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --audit-level=high fails the build only on high/critical advisories
      # (like the cloudinary one this was added after finding) — moderate/low
      # findings are common in transitive dev tooling and would make this
      # noisy without adding real signal. --omit=dev keeps that noise out
      # entirely by only scanning what actually ships to production, since a
      # vulnerable devDependency (a linter, a test runner) never reaches a
      # deployed server or a built frontend bundle. A version bump behind a
      # security advisory should fail CI here rather than sit unnoticed until
      # someone happens to run `npm audit` manually.
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend lint, syntax check & tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Syntax check all source files
        run: find src -name "*.js" -exec node --check {} +

      # mongodb-memory-server (used by tests/helpers/db.js) downloads a real
      # MongoDB binary on first use. Without a cache, every single CI run
      # re-downloads it from scratch and fails outright on any network
      # hiccup — this is the single biggest source of "tests sometimes just
      # fail" in CI specifically (a warm local machine doesn't have this
      # problem since the binary stays cached on disk between runs). The
      # cache key is pinned to MONGOMS_VERSION (set in
      # tests/helpers/db.js) so a version bump there automatically busts
      # this cache instead of silently using a stale binary.
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-7.0.14

      - name: Run tests
        env:
          MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-binaries
        run: npm test